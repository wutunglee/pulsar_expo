<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>攤位核銷｜PulsarPump 博覽會兌換券</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div class="wrap">
  <div class="brand"><img src="/static/logo_white.png" alt="PulsarPump 脈衝星" height="36" style="height:36px;width:auto;margin-right:6px">攤位核銷</div>

  <section class="panel" id="login">
    <label for="pin">工作人員 PIN<input id="pin" type="password" inputmode="numeric" autocomplete="off"></label>
    <button class="primary" id="enter">進入</button>
    <p class="msg bad" id="loginMsg" hidden></p>
  </section>

  <div id="main" class="stack" style="gap:20px" hidden>
    <section class="panel">
      <div class="progress-top"><span class="muted" id="day"></span><button id="reload" style="padding:6px 12px;font-size:15px">更新</button></div>
      <div class="tiles">
        <div class="fact"><span>軟糖 今日剩餘</span><b class="big" id="gLeft">–</b><span id="gCap"></span></div>
        <div class="fact"><span>加碼軟糖 今日剩餘</span><b class="big" id="bLeft">–</b><span id="bCap"></span></div>
        <div class="fact"><span>勁速補 今日剩餘</span><b class="big" id="cLeft">–</b><span id="cCap"></span></div>
      </div>
    </section>

    <section class="panel">
      <label for="code">兌換代碼（兌換券上的 5 碼）
        <input id="code" autocomplete="off" autocapitalize="characters" maxlength="5" style="font-size:26px;letter-spacing:.18em;text-transform:uppercase"></label>
      <button class="primary" id="lookup">查詢</button>
      <p class="msg" id="msg" hidden></p>
    </section>

    <section class="panel" id="user" hidden></section>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let PIN = '', FRIEND_CHECK = '';
try { PIN = sessionStorage.getItem('pin') || ''; } catch (e) {}

async function call(path, data) {
  const r = await fetch(path, {method: data ? 'POST' : 'GET',
    headers: {'Content-Type': 'application/json', 'X-Staff-Pin': PIN},
    body: data ? JSON.stringify(data) : undefined});
  let j = {}; try { j = await r.json(); } catch (e) {}
  return {status: r.status, ...j};
}
function say(text, ok) { const m = $('msg'); m.hidden = !text; m.textContent = text || ''; m.className = 'msg ' + (ok ? 'ok' : 'bad'); }

async function today() {
  const r = await call('/api/staff/today');
  if (!r.ok) return false;
  FRIEND_CHECK = r.friend_check;
  $('day').textContent = r.day + (r.is_event_day ? '' : '（非展期，不能報到）');
  $('gLeft').textContent = r.gummy.left; $('gCap').textContent = '共 ' + r.gummy.cap + ' 份';
  $('bLeft').textContent = r.bonus.left; $('bCap').textContent = '共 ' + r.bonus.cap + ' 條';
  $('cLeft').textContent = r.crampeace.left; $('cCap').textContent = '共 ' + r.crampeace.cap + ' 包';
  return true;
}

const DIST = {half: '半馬', full: '全馬', cheer: '陪跑加油'};
const GIVE = {gummy: '軟糖 2 條', bonus: '加碼軟糖 1 條', crampeace: '勁速補 1 包'};
const ONSITE = {locked: '還沒領券', ended: '活動已結束'};
const ST = {locked: '未達成', waiting_partner: '等隊友到攤位', ready: '可以發', out_today: '今日已送完', ended: '活動已結束', claimed: '已領過'};

function show(u, note) {
  const r = u.rewards;
  const row = (key, name) => `<div class="reward ${r[key] === 'ready' ? 'on' : ''}"><b>${name}</b><span>${ST[r[key]]}</span></div>`;
  const onsiteLabel = r.onsite === 'ready' ? esc(r.onsite_text || '可以使用') + (r.onsite_uses ? `（已記錄 ${r.onsite_uses} 次）` : '') : ONSITE[r.onsite];
  const ready = ['gummy', 'bonus', 'crampeace'].some(k => r[k] === 'ready');
  $('user').hidden = false;
  $('user').innerHTML = `
    <div class="progress-top"><h3>${esc(u.name) || '（未提供名稱）'}</h3><b>${esc(u.code)}</b></div>
    <p class="${u.is_friend ? 'muted' : 'msg bad'}">${u.is_friend ? (u.is_new ? '新加入的好友' : '原本的好友') : FRIEND_CHECK === 'staff'
      ? '尚未確認好友。請看他手機上 PulsarPump 的 LINE 聊天室，確認已加入後按下方按鈕。'
      : FRIEND_CHECK === 'oa' ? '尚未加好友（或已封鎖）。請他加入後，在聊天室輸入「任務卡」。'
      : '尚未加好友，請他先加入並在兌換券按「重新整理」'}</p>
    ${!u.is_friend && FRIEND_CHECK === 'staff' ? '<button class="primary" id="okFriend">已看過，確認是好友</button>' : ''}
    <div class="tiles">
      <div class="fact"><span>補給時間表</span><b>${u.distance ? DIST[u.distance] + '款' : '還沒選距離'}</b></div>
      <div class="fact"><span>到場</span><b>${u.arrived ? '已報到' : '第一次來'}</b></div>
    </div>
    ${note || ''}
    ${row('gummy', '軟糖 2 條')}${row('bonus', '答題加碼 1 條')}${row('crampeace', '揪新朋友：勁速補 1 包')}
    <button class="primary" id="checkin" ${u.arrived && !ready ? 'disabled' : ''}>${u.arrived ? (ready ? '發放加碼並記錄' : '目前沒有可發的') : '報到並發放'}</button>
    <div class="reward ${r.onsite === 'ready' ? 'on' : ''}"><b>現場優惠券</b><span>${onsiteLabel}</span>
      ${r.onsite === 'ready' ? '<button id="onsite">客人用優惠結帳了：記錄一筆</button>' : ''}</div>`;
  const fb = $('okFriend');
  if (fb) fb.onclick = async () => {
    fb.disabled = true;
    const x = await call('/api/staff/friend', {code: u.code});
    say(x.ok ? '已確認好友。' : (x.error || '操作失敗'), x.ok);
    if (x.user) show(x.user);
  };
  $('checkin').onclick = async () => {
    $('checkin').disabled = true;
    const x = await call('/api/staff/checkin', {code: u.code});
    if (!x.ok) { say(x.error || '操作失敗', false); if (x.user) show(x.user); return; }
    const first = !u.arrived;
    const things = (first ? ['試喝 1 杯'] : []).concat(x.given.map(k => GIVE[k]));
    const mates = (x.mates_ready || []).map(m => `<button data-mate="${esc(m.code)}">隊友 ${esc(m.name)}（${esc(m.code)}）現在也能領勁速補，按這裡查他</button>`).join('');
    say('已記錄。', true);
    show(x.user, `<div class="panel alert"><h3>請交給他</h3><p class="big" style="font-size:24px;line-height:1.5">${things.length ? things.map(esc).join('<br>') : '這次沒有要給的東西'}</p>${mates}</div>`);
    $('user').querySelectorAll('[data-mate]').forEach(b => b.onclick = () => { $('code').value = b.dataset.mate; lookup(); });
    today();
  };
  const ob = $('onsite');
  if (ob) ob.onclick = async () => {
    ob.disabled = true;
    const x = await call('/api/staff/onsite', {code: u.code});
    say(x.ok ? '已記錄一筆現場優惠。' : (x.error || '操作失敗'), x.ok);
    if (x.user) show(x.user);
  };
}

async function lookup() {
  say('');
  const r = await call('/api/staff/lookup', {code: $('code').value});
  if (!r.ok) { $('user').hidden = true; return say(r.error || '查詢失敗', false); }
  show(r.user);
}

async function enter() {
  PIN = $('pin').value || PIN;
  if (await today()) {
    try { sessionStorage.setItem('pin', PIN); } catch (e) {}
    $('login').hidden = true; $('main').hidden = false; $('code').focus();
  } else if ($('pin').value) {
    $('loginMsg').hidden = false; $('loginMsg').textContent = 'PIN 不正確，或系統尚未設定。';
  }
}
$('enter').onclick = enter;
$('pin').addEventListener('keydown', e => { if (e.key === 'Enter') enter(); });
$('lookup').onclick = lookup;
$('code').addEventListener('keydown', e => { if (e.key === 'Enter') lookup(); });
$('reload').onclick = today;
if (PIN) enter();
</script>
</body>
</html>
