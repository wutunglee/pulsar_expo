<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>博覽會補給站兌換券｜PulsarPump 脈衝星</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@900&display=swap" rel="stylesheet">
<style>/* 任務卡（參加者頁）：一張紙本集章卡。米色紙、油墨黑字、橘紅印章、虛線撕口。
   攤位核銷頁與統計頁仍用 style.css。 */
:root{
  color-scheme: light;
  --desk:#e6dfd0; --paper:#f8f3e8; --paper-2:#fffdf7;
  --ink:#1f1b16; --muted:#6a6052; --rule:#b8ac96;
  --stamp:#c8401a;            /* 印泥色：品牌橘壓深，紙上才夠清楚 */
  --bad:#a3271a;
  --serif:"Noto Serif TC","Songti TC","PMingLiU",serif;
  --sans:"Noto Sans TC",ui-sans-serif,system-ui,-apple-system,"PingFang TC",Arial,sans-serif;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.7;-webkit-font-smoothing:antialiased}
.wrap{max-width:480px;margin:0 auto;padding:14px 12px 40px}
.sheet{background:var(--paper);padding:26px 22px 28px;position:relative;box-shadow:0 1px 0 rgba(31,27,22,.08),0 10px 24px rgba(31,27,22,.10)}
/* 上下緣的撕口齒孔 */
.sheet::before,.sheet::after{content:"";position:absolute;left:0;right:0;height:8px;background:radial-gradient(circle at 8px 0,var(--desk) 5px,transparent 5.5px) 0 0/16px 8px repeat-x}
.sheet::before{top:0}
.sheet::after{bottom:0;transform:scaleY(-1)}
p{margin:0}
a{color:var(--ink)}
h1{font-family:var(--serif);font-size:36px;line-height:1.2;font-weight:900;margin:0;letter-spacing:.02em}
h3{font-size:19px;font-weight:700;margin:0;line-height:1.45}
.muted{color:var(--muted)}
.note{font-size:16px;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
[hidden]{display:none!important}

/* 卡頭 */
.brand{display:flex;justify-content:space-between;align-items:flex-end;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:18px}
.brand img{display:block;height:44px;width:auto}
.brand span{text-align:right;font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.08em}
.hero{display:flex;flex-direction:column;gap:12px}
.facts{margin-top:4px}
.fact{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px dotted var(--rule);font-size:16px}
.fact span{color:var(--muted);white-space:nowrap}
.fact b{font-weight:700;text-align:right;line-height:1.6;font-variant-numeric:tabular-nums}
.cut{border:0;border-top:2px dashed var(--rule);margin:24px -22px;position:relative}
.cut::before,.cut::after{content:"";position:absolute;top:-10px;width:18px;height:18px;border-radius:50%;background:var(--desk)}
.cut::before{left:-9px}.cut::after{right:-9px}

/* 集章格 */
.progress{display:flex;flex-direction:column;gap:14px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline}
.progress-top b{font-family:var(--serif);font-size:26px;font-weight:900;font-variant-numeric:tabular-nums}
.stamps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.slot{aspect-ratio:1;border-radius:50%;border:1.5px dashed var(--rule);display:grid;place-items:center;color:var(--rule);font-family:var(--serif);font-weight:900;font-size:20px;position:relative}
.slot.done{border:2.5px solid var(--stamp);color:var(--stamp);font-size:17px;letter-spacing:.04em;box-shadow:inset 0 0 0 3px var(--paper),inset 0 0 0 4px var(--stamp);opacity:.92}
.slot.done:nth-child(1){transform:rotate(-9deg)}
.slot.done:nth-child(2){transform:rotate(6deg)}
.slot.done:nth-child(3){transform:rotate(-4deg)}
.slot.done:nth-child(4){transform:rotate(10deg)}
.slot.done:nth-child(5){transform:rotate(-6deg)}
.slot.new{animation:stamp .38s cubic-bezier(.2,1.4,.4,1) both}
@keyframes stamp{from{scale:1.9;opacity:0}to{scale:1;opacity:.92}}
.next-done{font-weight:700}
.stn{scroll-margin-top:8px}
.mycode{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:16px;border:1.5px solid var(--ink);padding:10px 14px;background:var(--paper-2)}
.mycode b{font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:27px;letter-spacing:.2em;font-weight:700}

/* 兌換券 */
.rewards{display:flex;flex-direction:column}
.reward{display:grid;grid-template-columns:1fr;gap:4px;padding:12px 0;border-bottom:1px dotted var(--rule);font-size:16px;color:var(--muted)}
.reward b{font-size:17px;font-weight:700;color:var(--ink)}
.reward.on b::before,.reward.warn b::before{content:"可領";display:inline-block;font-size:14px;border:1.5px solid var(--stamp);color:var(--stamp);padding:0 6px;margin-right:8px;transform:rotate(-4deg);line-height:1.5}
.reward.warn b::before{content:"注意";border-color:var(--ink);color:var(--ink)}
.reward.on{color:var(--ink)}
.reward button{margin-top:6px}
.coupon{display:block;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:24px;font-weight:700;letter-spacing:.1em;color:var(--ink);border:1.5px dashed var(--ink);padding:6px 12px;margin:4px 0;background:var(--paper-2);text-align:center}

/* 提醒區塊（同意說明、加好友） */
.panel{display:flex;flex-direction:column;gap:12px}
.panel.alert{border:2px solid var(--ink);padding:18px 18px 20px;background:var(--paper-2)}

/* 五個補給站 */
ol.route{list-style:none;margin:0;padding:0}
.stn{display:flex;flex-direction:column;gap:6px;padding:20px 0;border-top:1px solid var(--ink);position:relative}
.stn:first-child{border-top:2px solid var(--ink)}
.mark{font-family:var(--serif);font-size:30px;font-weight:900;line-height:1.1;color:var(--ink)}
.stn.done .mark{color:var(--rule)}
.card{display:flex;flex-direction:column;gap:12px;min-width:0}
.tags{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px;font-weight:700;letter-spacing:.08em;color:var(--muted)}
.tag.onsite{color:var(--ink);border-bottom:2px solid var(--stamp)}
.tag.ok{position:absolute;right:0;top:16px;color:var(--stamp);border:2px solid var(--stamp);padding:0 8px;transform:rotate(5deg);letter-spacing:.1em;background:var(--paper)}

/* 兌換券 */
.ticket{display:flex;flex-direction:column;gap:14px}
.ticket .for{font-family:var(--serif);font-size:24px;font-weight:900;line-height:1.3}
ul.items{list-style:none;margin:0;padding:0;border-top:2px solid var(--ink)}
.item{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-bottom:1px dotted var(--rule)}
.item b{display:block;font-size:18px}
.item span{display:block;font-size:15px;color:var(--muted)}
.item i{font-style:normal;font-size:14px;font-weight:700;letter-spacing:.08em;white-space:nowrap;color:var(--muted);border:1.5px dashed var(--rule);padding:1px 8px}
.item.on i{color:var(--ink);border:1.5px solid var(--ink)}
.item.done i{color:var(--stamp);border:2px solid var(--stamp);transform:rotate(-5deg)}
.item.done b{color:var(--muted)}
details.plan{border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);padding:14px 0}
details.plan summary{font-weight:700;cursor:pointer}
details.plan[open] summary{margin-bottom:12px}
details.plan>*+*{margin-top:10px}
.extra{display:flex;flex-direction:column;gap:12px;border-top:2px dashed var(--rule);padding-top:22px}
.extra-head{display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.plus{font-size:14px;font-weight:700;letter-spacing:.1em;color:var(--stamp);border:1.5px solid var(--stamp);padding:0 8px;transform:rotate(-3deg)}
.qa{display:flex;flex-direction:column;gap:8px;padding:12px 14px;background:var(--paper-2);border:1px solid var(--rule)}
.qa.now{border:1.5px solid var(--ink)}
.qa .q{font-weight:700;font-size:18px}
.qa .a b{display:block}
.coupon small{display:block;font-family:var(--sans);font-size:15px;font-weight:500;letter-spacing:0;color:var(--muted);margin-top:4px}
.coupon.used{color:var(--muted);border-color:var(--rule);text-decoration:line-through}
.coupon.used small{text-decoration:none;color:var(--stamp);font-weight:700}
button.link{display:inline;border:0;padding:0;font-size:16px;font-weight:500;text-decoration:underline;color:var(--ink)}

.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cardback{aspect-ratio:3/4;font-family:var(--serif);font-size:30px;font-weight:900;color:var(--paper);background:var(--ink);border-color:var(--ink);padding:0;display:grid;place-items:center;box-shadow:inset 0 0 0 4px var(--ink),inset 0 0 0 5px var(--paper)}
.cardback:hover{background:var(--stamp);border-color:var(--stamp);box-shadow:inset 0 0 0 4px var(--stamp),inset 0 0 0 5px var(--paper)}
.myqr{display:grid;grid-template-columns:132px 1fr;gap:14px;align-items:center;border:1.5px solid var(--ink);padding:12px;background:var(--paper-2)}
.myqr .qr{background:#fff;padding:4px;line-height:0}
.myqr .qr svg{width:100%;height:auto;display:block}
.myqr b{display:block;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;font-size:27px;letter-spacing:.2em;font-weight:700}
.myqr span{display:block}
@media (max-width:360px){.myqr{grid-template-columns:1fr;justify-items:center;text-align:center}.myqr .qr{width:160px}}
.cardface{aspect-ratio:3/4;display:grid;place-items:center;align-content:center;gap:2px;text-align:center;font-size:13px;font-weight:700;line-height:1.3;border:1.5px solid var(--rule);background:var(--paper-2);color:var(--muted);position:relative;padding:2px;overflow-wrap:anywhere}
.cardface.mine{border:2.5px solid var(--stamp);color:var(--ink);box-shadow:inset 0 0 0 3px var(--paper-2),inset 0 0 0 4px var(--stamp)}
.cardface i{font-style:normal;font-size:12px;color:var(--stamp);letter-spacing:.06em}
.cardface.flip{animation:flip .45s ease-out both}
@keyframes flip{from{transform:rotateY(90deg);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.cardface.flip{animation:none}}

/* 按鈕與輸入 */
button,.btn{font:inherit;color:var(--ink);cursor:pointer;border-radius:4px;border:1.5px solid var(--ink);background:transparent;padding:12px 14px;font-weight:700;font-size:17px;text-decoration:none;text-align:center;display:block;transition:transform .12s,background .12s}
button:active,.btn:active{transform:translateY(1px)}
button[disabled]{opacity:.45;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,a:focus-visible{outline:2px solid var(--stamp);outline-offset:2px}
.primary{background:var(--ink);color:var(--paper);width:100%}
button.sel{background:var(--stamp);border-color:var(--stamp);color:#fff}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.codebox{display:grid;grid-template-columns:1fr auto;gap:8px}
input,textarea{font:inherit;font-size:17px;color:var(--ink);background:var(--paper-2);border:1.5px solid var(--rule);border-radius:4px;padding:11px 12px;width:100%}
input::placeholder,textarea::placeholder{color:#9b907e}
textarea{min-height:88px;resize:vertical}
label{font-size:16px;color:var(--muted);display:flex;flex-direction:column;gap:6px}
table{width:100%;border-collapse:collapse;font-size:16px;background:var(--paper-2);border:1px solid var(--rule)}
td{padding:8px 10px;border-bottom:1px dotted var(--rule);vertical-align:top;text-align:left}
tr:last-child td{border-bottom:0}
td:first-child{color:var(--muted);white-space:nowrap;font-weight:700}
.msg{font-size:16px}
.msg.ok{color:var(--ink);font-weight:700;border-left:3px solid var(--stamp);padding-left:10px}
.msg.bad{color:var(--bad)}
footer{font-size:14px;color:var(--muted);padding:18px 10px 0;line-height:1.6}
@media (prefers-reduced-motion:reduce){.slot.new{animation:none}button,.btn{transition:none}}
@media (max-width:360px){h1{font-size:31px}.sheet{padding:24px 16px}.cut{margin:22px -16px}.row{grid-template-columns:1fr}}

/* 券完成後的版面：兌換資訊在前，加碼收合在後 */
.ticket .done{font-family:var(--serif);font-size:24px;font-weight:900;line-height:1.3;color:var(--stamp)}
#pickup{border-top:2px solid var(--ink);padding-top:18px}
.more{display:flex;flex-direction:column;gap:2px;border-top:2px dashed var(--rule);padding-top:22px}
.more b{font-family:var(--serif);font-size:22px;font-weight:900}
.more span{font-size:15px;color:var(--muted)}
details.extra.opt{border-top:1px dotted var(--rule);padding-top:14px;gap:12px}
.more+details.extra.opt{border-top:0;padding-top:0}
details.extra.opt>summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;cursor:pointer;list-style:none}
details.extra.opt>summary::-webkit-details-marker{display:none}
details.extra.opt>summary b{font-size:17px;line-height:1.4}
details.extra.opt>summary i{font-style:normal;font-size:13px;font-weight:700;color:var(--stamp);border:1.5px solid var(--stamp);padding:0 6px;white-space:nowrap}
details.extra.opt>summary::after{content:"＋";grid-column:3;font-weight:700;color:var(--muted)}
details.extra.opt>summary:has(i)::after{content:none}
details.extra.opt[open]>summary::after{content:"－"}
details.extra.opt[open]>summary{margin-bottom:12px}
details.extra.opt>*+*{margin-top:12px}
#draw details>summary{cursor:pointer;font-size:15px;color:var(--muted);text-decoration:underline}
#draw details[open]>summary{margin-bottom:10px}

.demo{background:#1f1b16;color:#f8f3e8;padding:12px 14px;margin-bottom:12px;font-size:15px;line-height:1.6}
.demo b{display:block;margin-bottom:6px}
.demo div{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.demo button{color:#f8f3e8;border-color:#f8f3e8;font-size:15px;padding:6px 10px}
</style>
</head>

  // qrcode
  //---------------------------------------------------------------------

  /**
   * qrcode
   * @param typeNumber 1 to 40
   * @param errorCorrectionLevel 'L','M','Q','H'
   */
  var qrcode = function(typeNumber, errorCorrectionLevel) {

    var PAD0 = 0xEC;
    var PAD1 = 0x11;

    var _typeNumber = typeNumber;
    var _errorCorrectionLevel = QRErrorCorrectionLevel[errorCorrectionLevel];
    var _modules = null;
    var _moduleCount = 0;
    var _dataCache = null;
    var _dataList = [];

    var _this = {};

    var makeImpl = function(test, maskPattern) {

      _moduleCount = _typeNumber * 4 + 17;
      _modules = function(moduleCount) {
        var modules = new Array(moduleCount);
        for (var row = 0; row < moduleCount; row += 1) {
          modules[row] = new Array(moduleCount);
          for (var col = 0; col < moduleCount; col += 1) {
            modules[row][col] = null;
          }
        }
        return modules;
      }(_moduleCount);

      setupPositionProbePattern(0, 0);
      setupPositionProbePattern(_moduleCount - 7, 0);
      setupPositionProbePattern(0, _moduleCount - 7);
      setupPositionAdjustPattern();
      setupTimingPattern();
      setupTypeInfo(test, maskPattern);

      if (_typeNumber >= 7) {
        setupTypeNumber(test);
      }

      if (_dataCache == null) {
        _dataCache = createData(_typeNumber, _errorCorrectionLevel, _dataList);
      }

      mapData(_dataCache, maskPattern);
    };

    var setupPositionProbePattern = function(row, col) {

      for (var r = -1; r <= 7; r += 1) {

        if (row + r <= -1 || _moduleCount <= row + r) continue;

        for (var c = -1; c <= 7; c += 1) {

          if (col + c <= -1 || _moduleCount <= col + c) continue;

          if ( (0 <= r && r <= 6 && (c == 0 || c == 6) )
              || (0 <= c && c <= 6 && (r == 0 || r == 6) )
              || (2 <= r && r <= 4 && 2 <= c && c <= 4) ) {
            _modules[row + r][col + c] = true;
          } else {
            _modules[row + r][col + c] = false;
          }
        }
      }
    };

    var getBestMaskPattern = function() {

      var minLostPoint = 0;
      var pattern = 0;

      for (var i = 0; i < 8; i += 1) {

        makeImpl(true, i);

        var lostPoint = QRUtil.getLostPoint(_this);

        if (i == 0 || minLostPoint > lostPoint) {
          minLostPoint = lostPoint;
          pattern = i;
        }
      }

      return pattern;
    };

    var setupTimingPattern = function() {

      for (var r = 8; r < _moduleCount - 8; r += 1) {
        if (_modules[r][6] != null) {
          continue;
        }
        _modules[r][6] = (r % 2 == 0);
      }

      for (var c = 8; c < _moduleCount - 8; c += 1) {
        if (_modules[6][c] != null) {
          continue;
        }
        _modules[6][c] = (c % 2 == 0);
      }
    };

    var setupPositionAdjustPattern = function() {

      var pos = QRUtil.getPatternPosition(_typeNumber);

      for (var i = 0; i < pos.length; i += 1) {

        for (var j = 0; j < pos.length; j += 1) {

          var row = pos[i];
          var col = pos[j];

          if (_modules[row][col] != null) {
            continue;
          }

          for (var r = -2; r <= 2; r += 1) {

            for (var c = -2; c <= 2; c += 1) {

              if (r == -2 || r == 2 || c == -2 || c == 2
                  || (r == 0 && c == 0) ) {
                _modules[row + r][col + c] = true;
              } else {
                _modules[row + r][col + c] = false;
              }
            }
          }
        }
      }
    };

    var setupTypeNumber = function(test) {

      var bits = QRUtil.getBCHTypeNumber(_typeNumber);

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[Math.floor(i / 3)][i % 3 + _moduleCount - 8 - 3] = mod;
      }

      for (var i = 0; i < 18; i += 1) {
        var mod = (!test && ( (bits >> i) & 1) == 1);
        _modules[i % 3 + _moduleCount - 8 - 3][Math.floor(i / 3)] = mod;
      }
    };

    var setupTypeInfo = function(test, maskPattern) {

      var data = (_errorCorrectionLevel << 3) | maskPattern;
      var bits = QRUtil.getBCHTypeInfo(data);

      // vertical
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 6) {
          _modules[i][8] = mod;
        } else if (i < 8) {
          _modules[i + 1][8] = mod;
        } else {
          _modules[_moduleCount - 15 + i][8] = mod;
        }
      }

      // horizontal
      for (var i = 0; i < 15; i += 1) {

        var mod = (!test && ( (bits >> i) & 1) == 1);

        if (i < 8) {
          _modules[8][_moduleCount - i - 1] = mod;
        } else if (i < 9) {
          _modules[8][15 - i - 1 + 1] = mod;
        } else {
          _modules[8][15 - i - 1] = mod;
        }
      }

      // fixed module
      _modules[_moduleCount - 8][8] = (!test);
    };

    var mapData = function(data, maskPattern) {

      var inc = -1;
      var row = _moduleCount - 1;
      var bitIndex = 7;
      var byteIndex = 0;
      var maskFunc = QRUtil.getMaskFunction(maskPattern);

      for (var col = _moduleCount - 1; col > 0; col -= 2) {

        if (col == 6) col -= 1;

        while (true) {

          for (var c = 0; c < 2; c += 1) {

            if (_modules[row][col - c] == null) {

              var dark = false;

              if (byteIndex < data.length) {
                dark = ( ( (data[byteIndex] >>> bitIndex) & 1) == 1);
              }

              var mask = maskFunc(row, col - c);

              if (mask) {
                dark = !dark;
              }

              _modules[row][col - c] = dark;
              bitIndex -= 1;

              if (bitIndex == -1) {
                byteIndex += 1;
                bitIndex = 7;
              }
            }
          }

          row += inc;

          if (row < 0 || _moduleCount <= row) {
            row -= inc;
            inc = -inc;
            break;
          }
        }
      }
    };

    var createBytes = function(buffer, rsBlocks) {

      var offset = 0;

      var maxDcCount = 0;
      var maxEcCount = 0;

      var dcdata = new Array(rsBlocks.length);
      var ecdata = new Array(rsBlocks.length);

      for (var r = 0; r < rsBlocks.length; r += 1) {

        var dcCount = rsBlocks[r].dataCount;
        var ecCount = rsBlocks[r].totalCount - dcCount;

        maxDcCount = Math.max(maxDcCount, dcCount);
        maxEcCount = Math.max(maxEcCount, ecCount);

        dcdata[r] = new Array(dcCount);

        for (var i = 0; i < dcdata[r].length; i += 1) {
          dcdata[r][i] = 0xff & buffer.getBuffer()[i + offset];
        }
        offset += dcCount;

        var rsPoly = QRUtil.getErrorCorrectPolynomial(ecCount);
        var rawPoly = qrPolynomial(dcdata[r], rsPoly.getLength() - 1);

        var modPoly = rawPoly.mod(rsPoly);
        ecdata[r] = new Array(rsPoly.getLength() - 1);
        for (var i = 0; i < ecdata[r].length; i += 1) {
          var modIndex = i + modPoly.getLength() - ecdata[r].length;
          ecdata[r][i] = (modIndex >= 0)? modPoly.getAt(modIndex) : 0;
        }
      }

      var totalCodeCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalCodeCount += rsBlocks[i].totalCount;
      }

      var data = new Array(totalCodeCount);
      var index = 0;

      for (var i = 0; i < maxDcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < dcdata[r].length) {
            data[index] = dcdata[r][i];
            index += 1;
          }
        }
      }

      for (var i = 0; i < maxEcCount; i += 1) {
        for (var r = 0; r < rsBlocks.length; r += 1) {
          if (i < ecdata[r].length) {
            data[index] = ecdata[r][i];
            index += 1;
          }
        }
      }

      return data;
    };

    var createData = function(typeNumber, errorCorrectionLevel, dataList) {

      var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, errorCorrectionLevel);

      var buffer = qrBitBuffer();

      for (var i = 0; i < dataList.length; i += 1) {
        var data = dataList[i];
        buffer.put(data.getMode(), 4);
        buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
        data.write(buffer);
      }

      // calc num max data.
      var totalDataCount = 0;
      for (var i = 0; i < rsBlocks.length; i += 1) {
        totalDataCount += rsBlocks[i].dataCount;
      }

      if (buffer.getLengthInBits() > totalDataCount * 8) {
        throw 'code length overflow. ('
          + buffer.getLengthInBits()
          + '>'
          + totalDataCount * 8
          + ')';
      }

      // end code
      if (buffer.getLengthInBits() + 4 <= totalDataCount * 8) {
        buffer.put(0, 4);
      }

      // padding
      while (buffer.getLengthInBits() % 8 != 0) {
        buffer.putBit(false);
      }

      // padding
      while (true) {

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD0, 8);

        if (buffer.getLengthInBits() >= totalDataCount * 8) {
          break;
        }
        buffer.put(PAD1, 8);
      }

      return createBytes(buffer, rsBlocks);
    };

    _this.addData = function(data, mode) {

      mode = mode || 'Byte';

      var newData = null;

      switch(mode) {
      case 'Numeric' :
        newData = qrNumber(data);
        break;
      case 'Alphanumeric' :
        newData = qrAlphaNum(data);
        break;
      case 'Byte' :
        newData = qr8BitByte(data);
        break;
      case 'Kanji' :
        newData = qrKanji(data);
        break;
      default :
        throw 'mode:' + mode;
      }

      _dataList.push(newData);
      _dataCache = null;
    };

    _this.isDark = function(row, col) {
      if (row < 0 || _moduleCount <= row || col < 0 || _moduleCount <= col) {
        throw row + ',' + col;
      }
      return _modules[row][col];
    };

    _this.getModuleCount = function() {
      return _moduleCount;
    };

    _this.make = function() {
      if (_typeNumber < 1) {
        var typeNumber = 1;

        for (; typeNumber < 40; typeNumber++) {
          var rsBlocks = QRRSBlock.getRSBlocks(typeNumber, _errorCorrectionLevel);
          var buffer = qrBitBuffer();

          for (var i = 0; i < _dataList.length; i++) {
            var data = _dataList[i];
            buffer.put(data.getMode(), 4);
            buffer.put(data.getLength(), QRUtil.getLengthInBits(data.getMode(), typeNumber) );
            data.write(buffer);
          }

          var totalDataCount = 0;
          for (var i = 0; i < rsBlocks.length; i++) {
            totalDataCount += rsBlocks[i].dataCount;
          }

          if (buffer.getLengthInBits() <= totalDataCount * 8) {
            break;
          }
        }

        _typeNumber = typeNumber;
      }

      makeImpl(false, getBestMaskPattern() );
    };

    _this.createTableTag = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var qrHtml = '';

      qrHtml += '<table style="';
      qrHtml += ' border-width: 0px; border-style: none;';
      qrHtml += ' border-collapse: collapse;';
      qrHtml += ' padding: 0px; margin: ' + margin + 'px;';
      qrHtml += '">';
      qrHtml += '<tbody>';

      for (var r = 0; r < _this.getModuleCount(); r += 1) {

        qrHtml += '<tr>';

        for (var c = 0; c < _this.getModuleCount(); c += 1) {
          qrHtml += '<td style="';
          qrHtml += ' border-width: 0px; border-style: none;';
          qrHtml += ' border-collapse: collapse;';
          qrHtml += ' padding: 0px; margin: 0px;';
          qrHtml += ' width: ' + cellSize + 'px;';
          qrHtml += ' height: ' + cellSize + 'px;';
          qrHtml += ' background-color: ';
          qrHtml += _this.isDark(r, c)? '#000000' : '#ffffff';
          qrHtml += ';';
          qrHtml += '"/>';
        }

        qrHtml += '</tr>';
      }

      qrHtml += '</tbody>';
      qrHtml += '</table>';

      return qrHtml;
    };

    _this.createSvgTag = function(cellSize, margin, alt, title) {

      var opts = {};
      if (typeof arguments[0] == 'object') {
        // Called by options.
        opts = arguments[0];
        // overwrite cellSize and margin.
        cellSize = opts.cellSize;
        margin = opts.margin;
        alt = opts.alt;
        title = opts.title;
      }

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      // Compose alt property surrogate
      alt = (typeof alt === 'string') ? {text: alt} : alt || {};
      alt.text = alt.text || null;
      alt.id = (alt.text) ? alt.id || 'qrcode-description' : null;

      // Compose title property surrogate
      title = (typeof title === 'string') ? {text: title} : title || {};
      title.text = title.text || null;
      title.id = (title.text) ? title.id || 'qrcode-title' : null;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var c, mc, r, mr, qrSvg='', rect;

      rect = 'l' + cellSize + ',0 0,' + cellSize +
        ' -' + cellSize + ',0 0,-' + cellSize + 'z ';

      qrSvg += '<svg version="1.1" xmlns="http://www.w3.org/2000/svg"';
      qrSvg += !opts.scalable ? ' width="' + size + 'px" height="' + size + 'px"' : '';
      qrSvg += ' viewBox="0 0 ' + size + ' ' + size + '" ';
      qrSvg += ' preserveAspectRatio="xMinYMin meet"';
      qrSvg += (title.text || alt.text) ? ' role="img" aria-labelledby="' +
          escapeXml([title.id, alt.id].join(' ').trim() ) + '"' : '';
      qrSvg += '>';
      qrSvg += (title.text) ? '<title id="' + escapeXml(title.id) + '">' +
          escapeXml(title.text) + '</title>' : '';
      qrSvg += (alt.text) ? '<description id="' + escapeXml(alt.id) + '">' +
          escapeXml(alt.text) + '</description>' : '';
      qrSvg += '<rect width="100%" height="100%" fill="white" cx="0" cy="0"/>';
      qrSvg += '<path d="';

      for (r = 0; r < _this.getModuleCount(); r += 1) {
        mr = r * cellSize + margin;
        for (c = 0; c < _this.getModuleCount(); c += 1) {
          if (_this.isDark(r, c) ) {
            mc = c*cellSize+margin;
            qrSvg += 'M' + mc + ',' + mr + rect;
          }
        }
      }

      qrSvg += '" stroke="transparent" fill="black"/>';
      qrSvg += '</svg>';

      return qrSvg;
    };

    _this.createDataURL = function(cellSize, margin) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      return createDataURL(size, size, function(x, y) {
        if (min <= x && x < max && min <= y && y < max) {
          var c = Math.floor( (x - min) / cellSize);
          var r = Math.floor( (y - min) / cellSize);
          return _this.isDark(r, c)? 0 : 1;
        } else {
          return 1;
        }
      } );
    };

    _this.createImgTag = function(cellSize, margin, alt) {

      cellSize = cellSize || 2;
      margin = (typeof margin == 'undefined')? cellSize * 4 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;

      var img = '';
      img += '<img';
      img += '\u0020src="';
      img += _this.createDataURL(cellSize, margin);
      img += '"';
      img += '\u0020width="';
      img += size;
      img += '"';
      img += '\u0020height="';
      img += size;
      img += '"';
      if (alt) {
        img += '\u0020alt="';
        img += escapeXml(alt);
        img += '"';
      }
      img += '/>';

      return img;
    };

    var escapeXml = function(s) {
      var escaped = '';
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charAt(i);
        switch(c) {
        case '<': escaped += '&lt;'; break;
        case '>': escaped += '&gt;'; break;
        case '&': escaped += '&amp;'; break;
        case '"': escaped += '&quot;'; break;
        default : escaped += c; break;
        }
      }
      return escaped;
    };

    var _createHalfASCII = function(margin) {
      var cellSize = 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r1, r2, p;

      var blocks = {
        '██': '█',
        '█ ': '▀',
        ' █': '▄',
        '  ': ' '
      };

      var blocksLastLineNoMargin = {
        '██': '▀',
        '█ ': '▀',
        ' █': ' ',
        '  ': ' '
      };

      var ascii = '';
      for (y = 0; y < size; y += 2) {
        r1 = Math.floor((y - min) / cellSize);
        r2 = Math.floor((y + 1 - min) / cellSize);
        for (x = 0; x < size; x += 1) {
          p = '█';

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r1, Math.floor((x - min) / cellSize))) {
            p = ' ';
          }

          if (min <= x && x < max && min <= y+1 && y+1 < max && _this.isDark(r2, Math.floor((x - min) / cellSize))) {
            p += ' ';
          }
          else {
            p += '█';
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          ascii += (margin < 1 && y+1 >= max) ? blocksLastLineNoMargin[p] : blocks[p];
        }

        ascii += '\n';
      }

      if (size % 2 && margin > 0) {
        return ascii.substring(0, ascii.length - size - 1) + Array(size+1).join('▀');
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.createASCII = function(cellSize, margin) {
      cellSize = cellSize || 1;

      if (cellSize < 2) {
        return _createHalfASCII(margin);
      }

      cellSize -= 1;
      margin = (typeof margin == 'undefined')? cellSize * 2 : margin;

      var size = _this.getModuleCount() * cellSize + margin * 2;
      var min = margin;
      var max = size - margin;

      var y, x, r, p;

      var white = Array(cellSize+1).join('██');
      var black = Array(cellSize+1).join('  ');

      var ascii = '';
      var line = '';
      for (y = 0; y < size; y += 1) {
        r = Math.floor( (y - min) / cellSize);
        line = '';
        for (x = 0; x < size; x += 1) {
          p = 1;

          if (min <= x && x < max && min <= y && y < max && _this.isDark(r, Math.floor((x - min) / cellSize))) {
            p = 0;
          }

          // Output 2 characters per pixel, to create full square. 1 character per pixels gives only half width of square.
          line += p ? white : black;
        }

        for (r = 0; r < cellSize; r += 1) {
          ascii += line + '\n';
        }
      }

      return ascii.substring(0, ascii.length-1);
    };

    _this.renderTo2dContext = function(context, cellSize) {
      cellSize = cellSize || 2;
      var length = _this.getModuleCount();
      for (var row = 0; row < length; row++) {
        for (var col = 0; col < length; col++) {
          context.fillStyle = _this.isDark(row, col) ? 'black' : 'white';
          context.fillRect(row * cellSize, col * cellSize, cellSize, cellSize);
        }
      }
    }

    return _this;
  };

  //---------------------------------------------------------------------
  // qrcode.stringToBytes
  //---------------------------------------------------------------------

  qrcode.stringToBytesFuncs = {
    'default' : function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        bytes.push(c & 0xff);
      }
      return bytes;
    }
  };

  qrcode.stringToBytes = qrcode.stringToBytesFuncs['default'];

  //---------------------------------------------------------------------
  // qrcode.createStringToBytes
  //---------------------------------------------------------------------

  /**
   * @param unicodeData base64 string of byte array.
   * [16bit Unicode],[16bit Bytes], ...
   * @param numChars
   */
  qrcode.createStringToBytes = function(unicodeData, numChars) {

    // create conversion map.

    var unicodeMap = function() {

      var bin = base64DecodeInputStream(unicodeData);
      var read = function() {
        var b = bin.read();
        if (b == -1) throw 'eof';
        return b;
      };

      var count = 0;
      var unicodeMap = {};
      while (true) {
        var b0 = bin.read();
        if (b0 == -1) break;
        var b1 = read();
        var b2 = read();
        var b3 = read();
        var k = String.fromCharCode( (b0 << 8) | b1);
        var v = (b2 << 8) | b3;
        unicodeMap[k] = v;
        count += 1;
      }
      if (count != numChars) {
        throw count + ' != ' + numChars;
      }

      return unicodeMap;
    }();

    var unknownChar = '?'.charCodeAt(0);

    return function(s) {
      var bytes = [];
      for (var i = 0; i < s.length; i += 1) {
        var c = s.charCodeAt(i);
        if (c < 128) {
          bytes.push(c);
        } else {
          var b = unicodeMap[s.charAt(i)];
          if (typeof b == 'number') {
            if ( (b & 0xff) == b) {
              // 1byte
              bytes.push(b);
            } else {
              // 2bytes
              bytes.push(b >>> 8);
              bytes.push(b & 0xff);
            }
          } else {
            bytes.push(unknownChar);
          }
        }
      }
      return bytes;
    };
  };

  //---------------------------------------------------------------------
  // QRMode
  //---------------------------------------------------------------------

  var QRMode = {
    MODE_NUMBER :    1 << 0,
    MODE_ALPHA_NUM : 1 << 1,
    MODE_8BIT_BYTE : 1 << 2,
    MODE_KANJI :     1 << 3
  };

  //---------------------------------------------------------------------
  // QRErrorCorrectionLevel
  //---------------------------------------------------------------------

  var QRErrorCorrectionLevel = {
    L : 1,
    M : 0,
    Q : 3,
    H : 2
  };

  //---------------------------------------------------------------------
  // QRMaskPattern
  //---------------------------------------------------------------------

  var QRMaskPattern = {
    PATTERN000 : 0,
    PATTERN001 : 1,
    PATTERN010 : 2,
    PATTERN011 : 3,
    PATTERN100 : 4,
    PATTERN101 : 5,
    PATTERN110 : 6,
    PATTERN111 : 7
  };

  // QRUtil
  //---------------------------------------------------------------------

      [6, 28, 50, 72, 94],
      [6, 26, 50, 74, 98],
      [6, 30, 54, 78, 102],
      [6, 28, 54, 80, 106],
      [6, 32, 58, 84, 110],
      [6, 30, 58, 86, 114],
      [6, 34, 62, 90, 118],
      [6, 26, 50, 74, 98, 122],
      [6, 30, 54, 78, 102, 126],
      [6, 26, 52, 78, 104, 130],
      [6, 30, 56, 82, 108, 134],

      absent: absent, absent_code: absent ? 'EV-TPEMARA-2612' : '', absent_text: '滿 2,000 元折 250 元，2027/1/19 前有效'},
    today: {is_event_day: D.eventDay, over: D.over, left: D.eventDay ? {gummy: 150, bonus: 150, crampeace: 80} : null}};
}
async function api(path, data) {
  const fail = m => { const e = new Error(m); e.status = 400; throw e; };
  if (path === '/api/config') return DEMO.cfg;
  if (!JOINED) { const e = new Error('尚未加入'); e.status = 401; throw e; }
  if (path === '/api/consent') D.consent = true;
  if (path === '/api/distance') {
    D.distance = data.distance;
    // 跟正式版一樣：看到牌背之前先把牌洗好
    if (!D.hand) D.hand = ["p88", "p88", "p88", "p88", "gum200", "gum200", "gum200", "flask100", "flask100", "g_gummy", "g_gummy", "deal500", "deal500", "g_cramp", "g_noxx", "half"].map(v => [Math.random(), v]).sort((a, b) => a[0] - b[0]).map(v => v[1]);
  }
  if (path === '/api/quiz' && !(data.q in D.ans)) D.ans[data.q] = data.answer;
  // 這一版沒有主機，牌只好洗在網頁裡；正式版的牌存在主機，選之前網頁拿不到
  if (path === '/api/draw' && !D.prize && D.hand) { D.pick = data.pick; D.prize = D.hand[data.pick]; }
  if (path === '/api/ask') { if (!String(data.text || '').trim()) fail('請先寫下你的問題'); D.asked = true; }
  if (path === '/api/ref') fail('代碼不對，請再向朋友確認一次');
  return {ok: true, state: demoState()};
}
function demoDo(a) {
  const tip = document.getElementById('demoTip');
  tip.textContent = '';
  if (a === 'reset') { location.reload(); return; }
  if (a === 'landing') { JOINED = false; landing(); return; }
  if (!S || !S.distance) { tip.textContent = '先在下面的兌換券按「同意並開始」、選距離。'; return; }
  if (a === 'friend' || a === 'oldfriend') {
    if (!D.sent) { tip.textContent = '先在「加碼二」按「傳邀請給跑友」，再按這個按鈕。'; return; }
    D.partner = true; D.partnerNew = a === 'friend';
  }
  if (a === 'day') { D.eventDay = true; D.over = false; }
  if (a === 'checkin') {
    if (!D.eventDay) { tip.textContent = '要先切到博覽會當天，攤位才有人。'; return; }
    const before = Object.keys(D.got).length, first = !D.arrived;
    D.arrived = true;
    const s = demoState().rewards;
    ['gummy', 'bonus', 'crampeace'].forEach(k => { if (s[k] === 'ready') D.got[k] = true; });
    if (s.prize_gift === 'ready') D.got.prize = true;
    tip.textContent = first ? '工作人員按了「報到並發放」。' : Object.keys(D.got).length > before ? '工作人員發了新達成的加碼。' : '目前沒有新的東西可以領。';
  }
  if (a === 'mate') {
    if (!(D.partner && D.partnerNew)) { tip.textContent = '要先有一位新朋友接受邀請。'; return; }
    D.partnerArrived = true;
  }
  if (a === 'pay') {
    if (!D.eventDay) { tip.textContent = '現場優惠券只能在博覽會當天用，先切到博覽會當天。'; return; }
    if (!D.prize) { tip.textContent = '先在券上翻一張牌。'; return; }
    D.uses += 1; D.arrived = true;
  }
  if (a === 'over') { D.eventDay = false; D.over = true; }
  S = demoState(); flash = {}; render();
}

function loadScript(src) {
  return new Promise((res, rej) => {
    const s = document.createElement('script');
    s.src = src; s.onload = res; s.onerror = () => rej(new Error('LINE 元件載入失敗'));
    document.head.appendChild(s);
  });
}

async function openSession() {
  const payload = {ref: params.get('ref') || ''};
  const useDev = CFG.dev && (params.get('dev_user') || CFG.identity !== 'oa');
  if (CFG.identity === 'oa' && !useDev) {
    try {
      S = (await api('/api/me')).state;
      return true;
    } catch (e) {
      if (e.status === 401) { landing(); return false; }
      throw e;
    }
  }
  if (CFG.liff_id) {
    if (!window.liff) await loadScript('https://static.line-scdn.net/liff/edge/2/sdk.js');
    await liff.init({liffId: CFG.liff_id});
    if (!liff.isLoggedIn()) { liff.login({redirectUri: location.href}); return false; }
    payload.id_token = liff.getIDToken();
    payload.access_token = liff.getAccessToken();
  } else if (useDev) {
    payload.dev_user = params.get('dev_user') || 'tester';
    payload.dev_friend = params.get('friend') !== '0';
    payload.dev_new = params.get('new') !== '0';
  } else {
    throw new Error('兌換券尚未開放');
  }
  try {
    S = (await api('/api/session', payload)).state;
  } catch (e) {
    // ID token 過期時重新登入一次
    if (e.status === 401 && CFG.liff_id && !params.get('relogin')) {
      liff.logout();
      const u = new URL(location.href); u.searchParams.set('relogin', '1');
      liff.login({redirectUri: u.toString()});
      return false;
    }
    throw e;
  }
  return true;
}

async function invite() { D.sent = true;
  const text = CFG.invite_text + inviteUrl();
  if (!CFG.demo && !window.liff && /Android|iPhone|iPad|Line\//i.test(navigator.userAgent)) {
    // 不在 LIFF 裡時，用 LINE 的分享連結開啟選擇聊天室的畫面
    location.href = 'https://line.me/R/share?text=' + encodeURIComponent(text);
    return {note: '朋友加入好友並領券後，你們就算一隊。'};
  }
  if (window.liff && liff.isApiAvailable && liff.isApiAvailable('shareTargetPicker')) {
    try {
      const res = await liff.shareTargetPicker([{type: 'text', text}]);
      if (res) return {note: '邀請已送出。朋友加入好友並領券後，你們就算一隊。'};
      return {};
    } catch (e) { /* 改用複製 */ }
  }
  try {
    await navigator.clipboard.writeText(text);
    return {note: '邀請文字已複製，貼給朋友就可以。'};
  } catch (e) {
    return {note: text};
  }
}

          : item(`${DIST[S.distance]}補給時間表`, '在下面可以先看，到攤位依你的配速調整', 'ready', '已備好')}
        ${item('能量軟糖 2 條', '到攤位就能領', r.gummy)}
        ${r.prize_gift ? item(esc(CFG.prizes[r.prize].title.replace('送你', '')), '翻牌抽到的，到攤位就能領', r.prize_gift) : ''}
        ${r.prize && !r.prize_gift && CFG.prizes[r.prize] ? item(esc(CFG.prizes[r.prize].title), '翻牌抽到的現場優惠', r.onsite === 'ended' ? 'ended' : 'ready', r.onsite === 'ended' ? '' : '現場可用') : ''}
        ${r.bonus !== 'locked' ? item('能量軟糖 1 條', '加碼一：答完 3 題', r.bonus) : ''}
        ${r.crampeace !== 'locked' ? item('勁速補 1 包', r.crampeace === 'waiting_partner' ? '加碼二：你和隊友都到攤位就能領' : '加碼二：揪新朋友', r.crampeace, r.crampeace === 'waiting_partner' ? '已組隊' : '') : ''}
      </ul>
    </section>
    ${onsiteBlock()}
    <section class="ticket" id="pickup">
      ${canDraw ? '' : `<p class="done">${S.arrived ? '歡迎再來' : '你的券準備好了'}</p>`}
      ${pickup()}
      ${qrBlock()}
      <p class="note">每人各限領一次，每日限量，送完為止。</p>
    </section>
    <details class="plan">
      <summary>先看你的${DIST[S.distance]}補給時間表</summary>
      ${plan}
      ${CFG.reviewed ? '' : '<p class="note">內容為草稿，待黎醫師確認。</p>'}
      ${S.plan_sent ? `<p class="note">這張表也傳到你的 LINE 了。之後在 PulsarPump 聊天室輸入「補給表」，隨時可以再拿一次。</p>` : CFG.identity === 'oa' ? `<p class="note">在 PulsarPump 聊天室輸入「補給表」，就會把這張表傳給你。</p>` : ''}
      <p class="note">到攤位可以請我們依你的配速調整。${S.arrived ? '' : ' <button class="link" data-act="redist">改距離</button>'}</p>
      ${editDistance ? distButtons : msg('dist')}
    </details>
    <div class="more"><b>想多拿一點？</b><span>下面都是加碼，不做也能到攤位兌換。</span></div>
    ${quizBlock()}
    ${teamBlock()}
    ${fold('ask', '問黎醫師', '補給、訓練的問題，先寫下來', S.asked ? '已送出' : '', `
      <p class="muted">${S.asked ? '問題收到了。' : ''}黎醫師會在活動後，從 PulsarPump 的 LINE 官方帳號逐一回覆。想當面問，也歡迎到攤位。</p>${S.asked ? msg('ask') : ''}
      <label for="q">${S.asked ? '還想再問一題' : '你的問題'}<textarea id="q" maxlength="200" placeholder="例如：全馬 30K 後胃口很差，還要硬吃嗎？"></textarea></label>
      <button data-act="ask">送出問題</button>${S.asked ? '' : msg('ask')}
      <p class="note">不回答個人病情、用藥與檢查數值，這類狀況請直接就醫。</p>`)}
    <p class="note">不能來博覽會？活動結束後，這裡會出現一張官網折扣券。</p>`;
  bind();
}

function bind() {
  app.querySelectorAll('[data-act]').forEach(el => el.addEventListener('click', () => {
    const a = el.dataset.act, v = el.dataset.v;
    if (a === 'redist') { editDistance = !editDistance; planOpen = true; return render(); }
    if (a === 'askcode') { askCode = !askCode; OPEN.team = true; return render(); }
    el.disabled = true;
    if (a === 'consent') return act('consent', () => api('/api/consent', {}));
    if (a === 'refresh') return act('refresh', async () => {
      await openSession();
      if (S.is_friend) return {};
      return {note: CFG.friend_check === 'staff' ? '還沒確認。到攤位請工作人員幫你確認。'
        : CFG.friend_check === 'oa' ? `還沒偵測到。加入後在聊天室輸入「${CFG.keyword}」再試一次。`
        : '還沒偵測到好友狀態，加入後再按一次。', bad: true};
    });
    if (a === 'dist') {
      // 第一次選：回到券的開頭看保留清單。之後改距離：留在原地、時間表保持展開
      const first = !S.distance;
      editDistance = false;
      if (!first) planOpen = true;
      return act('dist', async () => {
        const r = await api('/api/distance', {distance: v});
        return first ? r : {state: r.state, note: `已改成${DIST[v]}，時間表也換好了。`};
      }).then(() => { if (first) app.scrollIntoView({block: 'start'}); });
    }
    if (a === 'draw') { justDrew = true; return act('draw', () => api('/api/draw', {pick: Number(v)})).then(() => { justDrew = false; const el = document.getElementById('draw'); if (el) el.scrollIntoView({block: 'start', behavior: 'smooth'}); }); }
    if (a === 'quiz') { OPEN.quiz = true; } if (a === 'invite' || a === 'ref') { OPEN.team = true; } if (a === 'ask') { OPEN.ask = true; }
    if (a === 'quiz') return act('quiz', () => api('/api/quiz', {q: Number(el.dataset.q), answer: v === '1'}));
    if (a === 'invite') return act('invite', invite);
    if (a === 'ref') return act('ref', () => api('/api/ref', {code: document.getElementById('refcode').value}));
    if (a === 'ask') return act('ask', async () => {
      const r = await api('/api/ask', {text: document.getElementById('q').value});
      return {state: r.state, note: '已送出。'};
    });
  }));
  // 改距離時時間表要保持展開
  const d = app.querySelector('details.plan');
  if (d) { d.open = planOpen; d.addEventListener('toggle', () => { planOpen = d.open; }); }
  app.querySelectorAll('details[data-fold]').forEach(el =>
    el.addEventListener('toggle', () => { OPEN[el.dataset.fold] = el.open; }));
}

boot();

</script>
</body>
</html>
